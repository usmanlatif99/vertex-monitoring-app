version: '3.9'

services:

  db:
    image: postgres:16-alpine
    container_name: vv_db
    environment:
      POSTGRES_DB:       tasklog
      POSTGRES_USER:     tasklog
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_db_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasklog"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: vv_app
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    environment:
      NODE_ENV:       production
      PORT:           3000
      DB_HOST:        db
      DB_PORT:        5432
      DB_NAME:        tasklog
      DB_USER:        tasklog
      DB_PASSWORD:    ${DB_PASSWORD:-changeme_db_secret}
      JWT_SECRET:     ${JWT_SECRET:-changeme_jwt_secret_min_32_chars_here}
      ADMIN_EMAIL:    ${ADMIN_EMAIL:-admin@vv.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      ADMIN_NAME:     ${ADMIN_NAME:-Admin}
      SMTP_HOST:      ${SMTP_HOST:-}
      SMTP_PORT:      ${SMTP_PORT:-587}
      SMTP_SECURE:    ${SMTP_SECURE:-false}
      SMTP_USER:      ${SMTP_USER:-}
      SMTP_PASS:      ${SMTP_PASS:-}
      SMTP_FROM:      ${SMTP_FROM:-}
      APP_URL:        ${APP_URL:-https://tasks.vertex.pk}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: vv_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
