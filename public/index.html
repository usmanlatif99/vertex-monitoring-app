<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VE WorkLog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ── LOGIN ─────────────────────────────────────────────────── -->
<div id="login">
  <div class="login-card">
    <svg width="90" height="78" viewBox="0 0 240 210" xmlns="http://www.w3.org/2000/svg">
      <polygon points="0,0 52,0 104,210 52,210" fill="#b2b2b2"/>
      <polygon points="75,0 120,0 100,88 126,88 75,210 122,210 170,88 144,88 190,0 144,0 120,88 126,88" fill="#8a8a8a"/>
      <rect x="197" y="0"   width="43" height="57" rx="4" fill="#0077b6"/>
      <rect x="197" y="76"  width="36" height="57" rx="4" fill="#0077b6"/>
      <rect x="197" y="153" width="43" height="57" rx="4" fill="#0077b6"/>
    </svg>
    <h1>VE WorkLog</h1>
    <div class="sub">Daily task monitoring — Vertex Electronics &amp; Vision Engineering</div>
    <form id="login-form" onsubmit="doLogin(event)" style="margin-top:24px">
      <div class="fld">
        <label>Email address</label>
        <input id="l-email" type="email" placeholder="your@email.com" autocomplete="email" required>
      </div>
      <div class="fld" style="margin-top:12px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <label>Password</label>
          <button type="button" onclick="showForgotForm()" style="background:none;border:none;color:var(--accent);font-size:12px;cursor:pointer;padding:0;line-height:1">Forgot password?</button>
        </div>
        <input id="l-pass" type="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <div id="l-err" style="color:var(--red);font-size:13px;margin-top:8px;min-height:18px"></div>
      <button id="l-btn" type="submit" class="btn btn-amber" style="width:100%;margin-top:6px;padding:12px 16px;font-size:14px">
        Sign in
      </button>
    </form>
  </div>
</div>

<!-- ── FORCE CHANGE PASSWORD ─────────────────────────────── -->
<div id="force-change" style="display:none">
  <div class="login-card">
    <svg width="90" height="78" viewBox="0 0 240 210" xmlns="http://www.w3.org/2000/svg">
      <polygon points="0,0 52,0 104,210 52,210" fill="#b2b2b2"/>
      <polygon points="75,0 120,0 100,88 126,88 75,210 122,210 170,88 144,88 190,0 144,0 120,88 126,88" fill="#8a8a8a"/>
      <rect x="197" y="0"   width="43" height="57" rx="4" fill="#0077b6"/>
      <rect x="197" y="76"  width="36" height="57" rx="4" fill="#0077b6"/>
      <rect x="197" y="153" width="43" height="57" rx="4" fill="#0077b6"/>
    </svg>
    <h1>Set your password</h1>
    <div class="sub" style="margin-bottom:20px">Your account uses a default password. Please set a new one to continue.</div>
    <form id="fc-form" onsubmit="submitForceChange(event)">
      <div class="fld">
        <label>New password</label>
        <input id="fc-pass" type="password" placeholder="At least 6 characters" required>
      </div>
      <div class="fld" style="margin-top:12px">
        <label>Confirm password</label>
        <input id="fc-confirm" type="password" placeholder="Repeat new password" required>
      </div>
      <div id="fc-err" style="color:var(--red);font-size:13px;margin-top:8px;min-height:18px"></div>
      <button id="fc-btn" type="submit" class="btn btn-amber" style="width:100%;margin-top:6px;padding:12px 16px;font-size:14px">
        Set password &amp; continue
      </button>
    </form>
  </div>
</div>

<!-- ── APP ──────────────────────────────────────────────────── -->
<div id="app" style="display:none">
  <header>
    <button class="hamburger" onclick="toggleNav()" aria-label="Menu">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect y="4"  width="22" height="2.2" rx="1.1" fill="currentColor"/>
        <rect y="10" width="22" height="2.2" rx="1.1" fill="currentColor"/>
        <rect y="16" width="22" height="2.2" rx="1.1" fill="currentColor"/>
      </svg>
    </button>
    <div class="brand">
      <svg width="46" height="40" viewBox="0 0 240 210" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">
        <polygon points="0,0 52,0 104,210 52,210" fill="#b2b2b2"/>
        <polygon points="75,0 120,0 100,88 126,88 75,210 122,210 170,88 144,88 190,0 144,0 120,88 126,88" fill="#8a8a8a"/>
        <rect x="197" y="0"   width="43" height="57" rx="4" fill="#0077b6"/>
        <rect x="197" y="76"  width="36" height="57" rx="4" fill="#0077b6"/>
        <rect x="197" y="153" width="43" height="57" rx="4" fill="#0077b6"/>
      </svg>
      <span>
        <span class="brand-name">VE WorkLog</span>
        <span id="hdr-date" class="brand-sub"></span>
      </span>
    </div>
    <div class="userchip">
      <div class="meta">
        <div id="hdr-name"></div>
        <div class="r" id="hdr-role"></div>
      </div>
      <div class="avatar" id="hdr-av"></div>
      <button class="switch" onclick="doLogout()">Sign out</button>
    </div>
  </header>
  <div class="shell">
    <nav id="nav"></nav>
    <main id="main"></main>
  </div>
</div>

<div class="nav-backdrop" onclick="toggleNav()"></div>
<div class="toast" id="toast"></div>

<script src="/app.js"></script>
</body>
</html>
